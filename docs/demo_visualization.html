      (function() {
        const extractions = [{"index": 0, "class": "market_move", "text": "\u5b81\u5fb7\u65f6\u4ee3(300750.SZ)\u5c3e\u76d8\u62c9\u5347,\u6536\u6da83.2%\u62a5212.5\u5143", "color": "#C8E6C9", "startPos": 69, "endPos": 115, "beforeText": "\u3010\u8d22\u8054\u793e8\u670812\u65e5\u7535\u3011\u5b81\u5fb7\u65f6\u4ee3\u516c\u544a\u79f0,\u516c\u53f8\u4e0e\u798f\u7279\u6c7d\u8f66\u7b7e\u7f72\u6218\u7565\u5408\u4f5c\u534f\u8bae,\n\u5c06\u4e8e2027\u5e74\u8d77\u5411\u5176\u5317\u7f8e\u5de5\u5382\u4f9b\u5e94\u78f7\u9178\u94c1\u9502\u7535\u6c60,\u9884\u8ba1\u5e74\u4f9b\u8d27\u91d1\u989d\u7ea645", "extractionText": "\u4ebf\u5143\u4eba\u6c11\u5e01\u3002\n\u53d7\u6b64\u6d88\u606f\u5f71\u54cd,\u5b81\u5fb7\u65f6\u4ee3(300750.SZ)\u5c3e\u76d8\u62c9\u5347,\u6536\u6da83.2%\u62a5212.5", "afterText": "\u5143\u3002\n\u540c\u65e5,\u592e\u884c\u5f00\u5c553800\u4ebf\u51437\u5929\u671f\u9006\u56de\u8d2d\u64cd\u4f5c,\u4e2d\u6807\u5229\u7387\u7ef4\u63011.8%\u4e0d\u53d8,\n\u5b9e\u73b0\u51c0\u6295\u653e1200\u4ebf\u5143\u3002\u5e02\u573a\u5206\u6790\u4eba\u58eb\u6307\u51fa,\u6d41\u52a8\u6027\u5bbd\u677e\u4fe1\u53f7\u660e\u663e\u3002\n", "attributesHtml": "<div><strong>class:</strong> market_move</div><div><strong>attributes:</strong> {<span class=\"lx-attr-key\">code</span>: <span class=\"lx-attr-value\">300750.SZ</span>, <span class=\"lx-attr-key\">change_percent</span>: <span class=\"lx-attr-value\">3.2%</span>, <span class=\"lx-attr-key\">current_price</span>: <span class=\"lx-attr-value\">212.5\u5143</span>}</div>"}, {"index": 1, "class": "macro_action", "text": "\u592e\u884c\u5f00\u5c553800\u4ebf\u51437\u5929\u671f\u9006\u56de\u8d2d\u64cd\u4f5c,\u4e2d\u6807\u5229\u7387\u7ef4\u63011.8%\u4e0d\u53d8", "color": "#D2E3FC", "startPos": 115, "endPos": 149, "beforeText": "\u3010\u8d22\u8054\u793e8\u670812\u65e5\u7535\u3011\u5b81\u5fb7\u65f6\u4ee3\u516c\u544a\u79f0,\u516c\u53f8\u4e0e\u798f\u7279\u6c7d\u8f66\u7b7e\u7f72\u6218\u7565\u5408\u4f5c\u534f\u8bae,\n\u5c06\u4e8e2027\u5e74\u8d77\u5411\u5176\u5317\u7f8e\u5de5\u5382\u4f9b\u5e94\u78f7\u9178\u94c1\u9502\u7535\u6c60,\u9884\u8ba1\u5e74\u4f9b\u8d27\u91d1\u989d\u7ea645\u4ebf\u5143\u4eba\u6c11\u5e01\u3002\n\u53d7\u6b64\u6d88\u606f\u5f71\u54cd,\u5b81\u5fb7\u65f6\u4ee3(300750.SZ)\u5c3e\u76d8\u62c9\u5347,\u6536\u6da83.2%\u62a5212.5", "extractionText": "\u5143\u3002\n\u540c\u65e5,\u592e\u884c\u5f00\u5c553800\u4ebf\u51437\u5929\u671f\u9006\u56de\u8d2d\u64cd\u4f5c,\u4e2d\u6807\u5229\u7387\u7ef4\u63011.8", "afterText": "%\u4e0d\u53d8,\n\u5b9e\u73b0\u51c0\u6295\u653e1200\u4ebf\u5143\u3002\u5e02\u573a\u5206\u6790\u4eba\u58eb\u6307\u51fa,\u6d41\u52a8\u6027\u5bbd\u677e\u4fe1\u53f7\u660e\u663e\u3002\n", "attributesHtml": "<div><strong>class:</strong> macro_action</div><div><strong>attributes:</strong> {<span class=\"lx-attr-key\">institution</span>: <span class=\"lx-attr-value\">\u592e\u884c</span>, <span class=\"lx-attr-key\">tool</span>: <span class=\"lx-attr-value\">\u9006\u56de\u8d2d</span>, <span class=\"lx-attr-key\">scale</span>: <span class=\"lx-attr-value\">3800\u4ebf\u5143</span>, <span class=\"lx-attr-key\">rate</span>: <span class=\"lx-attr-value\">1.8%</span>}</div>"}];
        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval = null;
        let animationSpeed = 1.0;

        function updateDisplay() {
          const extraction = extractions[currentIndex];
          if (!extraction) return;

          document.getElementById('attributesContainer').innerHTML = extraction.attributesHtml;
          document.getElementById('entityInfo').textContent = (currentIndex + 1) + '/' + extractions.length;
          document.getElementById('posInfo').textContent = '[' + extraction.startPos + '-' + extraction.endPos + ']';
          document.getElementById('progressSlider').value = currentIndex;

          const playBtn = document.querySelector('.lx-control-btn');
          if (playBtn) playBtn.textContent = isPlaying ? '⏸ Pause' : '▶️ Play';

          const prevHighlight = document.querySelector('.lx-text-window .lx-current-highlight');
          if (prevHighlight) prevHighlight.classList.remove('lx-current-highlight');
          const currentSpan = document.querySelector('.lx-text-window span[data-idx="' + currentIndex + '"]');
          if (currentSpan) {
            currentSpan.classList.add('lx-current-highlight');
            currentSpan.scrollIntoView({block: 'center', behavior: 'smooth'});
          }
        }

        function nextExtraction() {
          currentIndex = (currentIndex + 1) % extractions.length;
          updateDisplay();
        }

        function prevExtraction() {
          currentIndex = (currentIndex - 1 + extractions.length) % extractions.length;
          updateDisplay();
        }

        function jumpToExtraction(index) {
          currentIndex = parseInt(index);
          updateDisplay();
        }

        function playPause() {
          if (isPlaying) {
            clearInterval(animationInterval);
            isPlaying = false;
          } else {
            animationInterval = setInterval(nextExtraction, animationSpeed * 1000);
            isPlaying = true;
          }
          updateDisplay();
        }

        window.playPause = playPause;
        window.nextExtraction = nextExtraction;
        window.prevExtraction = prevExtraction;
        window.jumpToExtraction = jumpToExtraction;

        updateDisplay();
      })();
    </script>
