name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python evals/run_eval.py
      - name: promptfoo eval
        # Exit code 100 means "some case failed" and is also what a crashed
        # worker returns, so it cannot tell green from red. The gate step below
        # owns the verdict; this step only produces the report - but it records
        # its exit code, so that a missing report can be reported as a crash
        # rather than as an unreadable file.
        continue-on-error: true
        run: |
          set +e
          npx --yes promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml --no-cache --no-write --output /tmp/pf-results.json
          rc=$?
          echo "eval_exit=$rc" > /tmp/pf-eval-exit.txt
          exit $rc
      - name: promptfoo gate
        run: python3 evals/pf_provider.py /tmp/pf-results.json /tmp/pf-eval-exit.txt
