[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finnews-extractor"
version = "0.1.0"
description = "Chinese financial news → structured events, with independently verified source grounding"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
live = ["langextract>=0.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["finnews*"]
